# Fatos que o sistema pode PERGUNTAR ao usuário (encadeamento regressivo).
# padrao: valor usado se o usuário responder "não sei" (entra com CF de @params.cf_padrao); "@params.x" lê o parâmetro.
lote.estado: {texto: "O lote está em lactação ou seco?", tipo: opcao, opcoes: [lactacao, seca], ajuda: "Define se o sistema calcula exigência de leite ou de vaca seca.", texto_produtor: "As vacas deste lote estão dando leite ou estão secas?", ajuda_produtor: "Vaca seca e vaca em lactação precisam de comida bem diferente."}
lote.del: {texto: "Quantos dias em lactação (DEL) em média?", tipo: numero, unidade: dias, ajuda: "O consumo é menor nas primeiras semanas e define a fase (recém-parida, início, meio, final).", padrao: "@params.padrao_del", texto_produtor: "Há quantos dias, em média, as vacas pariram?", ajuda_produtor: "Logo depois do parto a vaca come menos; com isso o sistema sabe em que fase o lote está.", unidade_produtor: "dias desde o parto"}
lote.dias_para_parto: {texto: "Quantos dias faltam, em média, para o parto?", tipo: numero, unidade: dias, ajuda: "Vacas a 21 dias do parto vão para o pré-parto (dieta de transição).", texto_produtor: "Quantos dias faltam, em média, para as vacas parirem?", ajuda_produtor: "Nas últimas 3 semanas antes do parto a vaca precisa de uma dieta especial."}
lote.dias_gestacao: {texto: "Dias de gestação médios do lote (0 se vazias)", tipo: numero, unidade: dias, ajuda: "A partir de 190 dias a gestação passa a exigir energia e proteína. (Para vaca seca, o sistema deriva dos dias para o parto.)", padrao: "@params.padrao_dias_gestacao", texto_produtor: "Há quantos dias, em média, as vacas estão prenhes? (0 se estão vazias)", ajuda_produtor: "Depois de uns 6 meses de prenhez o bezerro começa a pedir comida extra."}
lote.grupo_genetico: {texto: "Qual o grupo genético predominante?", tipo: opcao, opcoes: [holandes, jersey, girolando, gir, mestica], ajuda: "Escolhe a equação de consumo (NRC 2001, ou NASEM 2021 com ECC, para Holandês e Jersey; BR-Leite para Gir, Girolando e mestiças).", texto_produtor: "Qual a raça da maioria das vacas?", ajuda_produtor: "Cada raça come e produz de um jeito; o sistema usa a conta certa para a raça."}
lote.sistema: {texto: "Qual o sistema de produção?", tipo: opcao, opcoes: [confinado, semiconfinado, pasto], ajuda: "Em pasto há gasto de energia com caminhada e o consumo é menos previsível.", texto_produtor: "Como as vacas comem?", ajuda_produtor: "No pasto a vaca anda mais e gasta mais energia; e é mais difícil saber quanto ela come."}
lote.pv: {texto: "Peso vivo médio (kg)", tipo: numero, unidade: kg, ajuda: "Entra em quase toda equação (mantença e consumo). Balança ou fita; não há valor padrão seguro (Holandês ~600–650, Girolando ~500, Jersey ~420).", texto_produtor: "Quanto pesa, em média, uma vaca do lote? (kg)", ajuda_produtor: "Quase toda conta depende do peso. Pese na balança ou com fita. Referência: Holandesa 600–650 kg, Girolando ~500, Jersey ~420."}
lote.leite: {texto: "Produção média por vaca (kg/dia)", tipo: numero, unidade: "kg/d", ajuda: "Define a exigência de energia e proteína para leite. Tanque ÷ nº de vacas serve.", texto_produtor: "Quantos litros cada vaca dá por dia, em média?", ajuda_produtor: "É o que define quanta comida o lote precisa. Dica: litros do tanque ÷ nº de vacas.", unidade_produtor: "L por vaca"}
lote.gordura: {texto: "Gordura do leite (%)", tipo: numero, unidade: "%", ajuda: "Vem no laudo mensal do laticínio. Corrige o leite para 4% e define a energia do leite.", padrao: "@params.padrao_gordura", texto_produtor: "Qual a gordura do leite? (%)", ajuda_produtor: "Vem no laudo do laticínio. Leite mais gordo pede mais energia na comida."}
lote.proteina: {texto: "Proteína do leite (%)", tipo: numero, unidade: "%", ajuda: "Vem no laudo do laticínio. Entra na energia e na proteína metabolizável do leite.", padrao: "@params.padrao_proteina", texto_produtor: "Qual a proteína do leite? (%)", ajuda_produtor: "Vem no laudo do laticínio. Ajuda a calcular a proteína que a dieta precisa ter."}
lote.fracao_primiparas: {texto: "Que fração do lote é de primíparas (0 a 1)?", tipo: numero, unidade: fração, ajuda: "Primíparas ainda crescem e precisam de energia extra.", padrao: "@params.padrao_fracao_primiparas", texto_produtor: "Que parte do lote é de novilhas de primeira cria? (0 a 1; ex.: 0,3 = 30%)", ajuda_produtor: "Novilhas de primeira cria ainda estão crescendo e precisam de comida a mais."}
lote.ecc: {texto: "Escore de condição corporal médio (1 a 5)", tipo: numero, escala: ecc, unidade: "1-5", ajuda: "Abaixo da meta da fase o sistema soma energia para recuperar; acima, aponta excesso. Sem ECC essas regras não se aplicam.", opcional: true, texto_produtor: "Como está a condição corporal das vacas? (escore de 1 a 5)", ajuda_produtor: "Vaca magra precisa de comida para recuperar; vaca gorda demais tem problema no parto. Se não souber, pode pular."}
lote.distancia_km: {texto: "Distância caminhada por dia (km)", tipo: numero, unidade: km, ajuda: "Caminhada até o piquete e a sala de ordenha gasta energia.", padrao: "@params.padrao_distancia_km", texto_produtor: "Quantos km as vacas andam por dia, mais ou menos?", ajuda_produtor: "Andar até o pasto e até a ordenha gasta energia."}
lote.relevo: {texto: "Relevo do pasto", tipo: opcao, opcoes: [plano, ondulado, acidentado], ajuda: "Terreno acidentado aumenta muito o gasto de energia.", padrao: plano, texto_produtor: "Como é o terreno do pasto?", ajuda_produtor: "Morro faz a vaca gastar muito mais energia andando."}
lote.temp: {texto: "Temperatura média do dia (°C)", tipo: numero, unidade: "°C", ajuda: "Com a umidade, calcula o ITU (estresse térmico reduz consumo e leite). Sem ela, o ITU não é avaliado.", opcional: true, texto_produtor: "Qual a temperatura média do dia? (°C)", ajuda_produtor: "Com a umidade, o sistema vê se o calor está atrapalhando as vacas. Se não souber, pode pular."}
lote.ur: {texto: "Umidade relativa média (%)", tipo: numero, unidade: "%", ajuda: "Com a temperatura, calcula o ITU. Sem ela, o ITU não é avaliado.", opcional: true, texto_produtor: "Qual a umidade do ar? (%)", ajuda_produtor: "Junto com a temperatura, mostra se o calor está incomodando as vacas. Se não souber, pode pular."}
lote.forrageira: {texto: "Qual a forrageira do pasto?", tipo: opcao, opcoes: [mombaca, tanzania, decumbens, marandu, outra], ajuda: "Define as alturas de entrada e saída do piquete.", opcional: true, texto_produtor: "Qual capim tem no pasto?", ajuda_produtor: "Cada capim tem a altura certa para entrar e tirar as vacas do piquete."}
