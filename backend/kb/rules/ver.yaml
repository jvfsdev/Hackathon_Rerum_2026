# Módulo C — Verificação da dieta: oferta × exigência e restrições. Termina num parecer.
- id: VER-00A
  versao: 1
  modulo: verificacao
  descricao: Energia efetivamente consumida (a vaca não come mais que o CMS previsto)
  prioridade: 90
  se:
    - {fato: dieta.ms_kg, op: ">", valor: 0}
    - {fato: exig.cms, op: existe}
  entao:
    - calcular: {fato: ver.ell_consumida, funcao: energia_consumida, args: {ms: $dieta.ms_kg, cms: $exig.cms, ell_kg: $dieta.ell_mcal_kg}}
    - calcular: {fato: ver.razao_ms, funcao: razao, args: {a: $dieta.ms_kg, b: $exig.cms}}
  fonte: "NRC 2001"
  forca: B

- id: VER-00B
  versao: 1
  modulo: verificacao
  descricao: Razão entre energia consumida e exigida
  prioridade: 85
  se:
    - {fato: ver.ell_consumida, op: existe}
    - {fato: exig.ell_total, op: existe}
  entao:
    - calcular: {fato: ver.razao_energia, funcao: razao, args: {a: $ver.ell_consumida, b: $exig.ell_total}}
  fonte: "NRC 2001"
  forca: B

- id: VER-00D
  versao: 1
  modulo: verificacao
  descricao: Leite que a energia consumida sustenta (energia que sobra ou falta convertida em kg de leite)
  prioridade: 84
  se:
    - {fato: ver.ell_consumida, op: existe}
    - {fato: exig.ell_total, op: existe}
    - {fato: exig.ell_leite, op: ">", valor: 0}
    - {fato: lote.leite, op: ">", valor: 0}
  entao:
    - calcular: {fato: ver.leite_permitido, funcao: leite_permitido, args: {ell_consumida: $ver.ell_consumida, ell_total: $exig.ell_total, ell_leite: $exig.ell_leite, leite: $lote.leite}}
  fonte: "NRC 2001 (leite permitido pela energia)"
  forca: B

- id: VER-00C
  versao: 1
  modulo: verificacao
  descricao: Razão entre PB da dieta e PB alvo
  prioridade: 85
  se:
    - {fato: dieta.pb_pct, op: existe}
    - {fato: exig.pb_pct_alvo, op: existe}
  entao:
    - calcular: {fato: ver.razao_pb, funcao: razao, args: {a: $dieta.pb_pct, b: $exig.pb_pct_alvo}}
  fonte: "MSD Vet Manual"
  forca: B

- id: VER-01
  versao: 1
  modulo: verificacao
  descricao: Energia consumida abaixo da exigência — déficit energético
  prioridade: 60
  cf: 0.9
  se:
    - {fato: ver.razao_energia, op: "<", valor: "$meta.fator_energia_min|@params.fator_energia_min"}
  entao:
    - concluir: {fato: ver.deficit_energetico, valor: true}
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Déficit energético: a dieta cobre {ver.razao_energia:.0%} da exigência"
        causa: "Consome {ver.ell_consumida:.1f} Mcal de ELl/dia contra {exig.ell_total:.1f} exigidas. Tende a perder ECC e produção."
        acao: "Aumentar a densidade energética (milho, polpa) ou melhorar o volumoso; rever a meta de leite."
        titulo_produtor: "A comida não dá a energia que o lote precisa ({ver.razao_energia:.0%} do necessário)"
        causa_produtor: "Sem energia suficiente as vacas emagrecem e produzem menos."
        acao_produtor: "Aumente milho ou polpa, use um volumoso melhor ou peça a sugestão de dieta."
  fonte: "Dossiê VER-01; NRC 2001 (conceito); limiar de 0,95: escolha de engenharia"
  forca: C

- id: VER-02
  versao: 1
  modulo: verificacao
  descricao: PB da dieta abaixo do alvo — déficit proteico
  prioridade: 60
  cf: 0.85
  se:
    - {fato: ver.razao_pb, op: "<", valor: "@params.fator_pb_min"}
  entao:
    - concluir: {fato: ver.deficit_proteico, valor: true}
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Déficit proteico: PB {dieta.pb_pct:.1f}% contra alvo de {exig.pb_pct_alvo:.1f}%"
        causa: "Proteína abaixo do necessário para a produção do lote."
        acao: "Incluir fonte proteica (farelo de soja, caroço de algodão) ou ureia até {@params.ureia_max}% da MS."
        titulo_produtor: "Falta proteína na dieta"
        causa_produtor: "A proteína está abaixo do que o lote precisa para produzir."
        acao_produtor: "Inclua farelo de soja ou caroço de algodão, ou ureia (no máximo {@params.ureia_max}% da comida seca)."
  fonte: "Dossiê VER-02 (lá sobre PM; aqui simplificado para a razão de PB); MSD Vet Manual; limiar de 0,95: escolha de engenharia"
  forca: C

- id: VER-02B
  versao: 1
  modulo: verificacao
  descricao: PB muito acima do alvo — desperdício de proteína
  prioridade: 60
  cf: 0.7
  se:
    - {fato: ver.razao_pb, op: ">", valor: "@params.fator_pb_max"}
  entao:
    - alerta:
        nivel: informativo
        categoria: economia
        titulo: "Proteína acima do necessário ({dieta.pb_pct:.1f}% contra {exig.pb_pct_alvo:.1f}%)"
        causa: "Proteína é o nutriente mais caro; o excesso vira ureia (NUL alto) e pode afetar a reprodução."
        acao: "Reduzir a fonte proteica e conferir o NUL no próximo laudo."
        titulo_produtor: "Proteína acima do necessário: dinheiro jogado fora"
        causa_produtor: "Proteína é o item mais caro da dieta; o que sobra sai na urina."
        acao_produtor: "Diminua o farelo ou a ureia e confira a ureia do leite no próximo laudo."
  fonte: "Penn State (NUL)"
  forca: C

- id: VER-03
  versao: 1
  modulo: verificacao
  descricao: FDN da dieta abaixo da meta — risco de acidose ruminal
  prioridade: 60
  cf: 0.85
  se:
    - {fato: dieta.fdn_pct, op: "<", valor: $meta.fdn_min}
  entao:
    - concluir: {fato: ver.risco_acidose, valor: true}
  fonte: "NRC 2001 (FDN ≥ 25% MS)"
  forca: B

- id: VER-03B
  versao: 1
  modulo: verificacao
  descricao: CNF acima do máximo — risco de acidose ruminal
  prioridade: 60
  cf: 0.8
  se:
    - {fato: dieta.cnf_pct, op: ">", valor: $meta.cnf_max}
  entao:
    - concluir: {fato: ver.risco_acidose, valor: true}
  fonte: "NRC 2001 (CNF ≤ 44% MS)"
  forca: B

- id: VER-03C
  versao: 1
  modulo: verificacao
  descricao: FDN de forragem abaixo de 19% — pouca fibra efetiva
  prioridade: 60
  cf: 0.7
  se:
    - {fato: dieta.fdnf_pct, op: "<", valor: $meta.fdnf_min}
  entao:
    - concluir: {fato: ver.risco_acidose, valor: true}
  fonte: "NRC 2001 (FDNf ≥ 19% MS)"
  forca: B

- id: VER-03D
  versao: 1
  modulo: verificacao
  descricao: FDN de forragem abaixo de 15% da MS — fora da tabela NRC, dieta bloqueada
  prioridade: 95
  se:
    - {fato: dieta.fdnf_pct, op: "<", valor: "@params.fdnf_min_absoluto"}
  entao:
    - concluir: {fato: parecer.bloqueio, valor: true}
    - alerta:
        nivel: critico
        categoria: dieta
        titulo: "Volumoso insuficiente: FDN de forragem {dieta.fdnf_pct:.1f}% da MS"
        causa: "Abaixo de {@params.fdnf_min_absoluto}% de FDN de forragem o NRC não tem recomendação segura: risco alto de acidose."
        acao: "Aumentar o volumoso da dieta."
        titulo_produtor: "Volumoso muito pouco: risco alto de acidose"
        causa_produtor: "Com tão pouco volumoso o rúmen azeda."
        acao_produtor: "Aumente o volumoso da dieta."
  fonte: "NRC 2001 (tabela de FDN mínimo vai até FDNf 15%)"
  forca: B

- id: VER-03Z
  versao: 1
  modulo: verificacao
  descricao: Emitir alerta de acidose com o CF combinado das evidências
  prioridade: 40
  se:
    - {fato: ver.risco_acidose, op: "=", valor: true}
  entao:
    - alerta:
        nivel: atencao
        categoria: dieta
        cf_de: ver.risco_acidose
        titulo: "Risco de acidose ruminal"
        causa: "FDN {dieta.fdn_pct:.1f}% (mín. {meta.fdn_min:.0f}%), FDNf {dieta.fdnf_pct:.1f}% (mín. {meta.fdnf_min:.0f}%), CNF {dieta.cnf_pct:.1f}% (máx. {meta.cnf_max:.0f}%)."
        acao: "Aumentar volumoso/fibra efetiva e reduzir amido rápido; conferir tamanho de partícula."
        titulo_produtor: "Risco de acidose: pouca fibra e muito grão"
        causa_produtor: "A dieta tem pouca fibra e muito amido para o rúmen."
        acao_produtor: "Mais volumoso, menos grão fino; confira o tamanho da picagem."
  fonte: "NRC 2001"
  forca: B

- id: VER-04
  versao: 1
  modulo: verificacao
  descricao: Ureia acima de 1% da MS — dieta bloqueada
  prioridade: 95
  se:
    - {fato: dieta.ureia_pct, op: ">", valor: $meta.ureia_max}
  entao:
    - concluir: {fato: parecer.bloqueio, valor: true}
    - alerta:
        nivel: critico
        categoria: dieta
        titulo: "Ureia acima do limite: {dieta.ureia_pct:.2f}% da MS (máx. {meta.ureia_max}%)"
        causa: "Excesso de ureia pode intoxicar os animais."
        acao: "Reduzir a ureia para no máximo {@params.ureia_max}% da MS, sempre misturada ao volumoso ou concentrado."
        titulo_produtor: "Ureia acima do limite: pode intoxicar"
        causa_produtor: "Ureia demais é veneno para a vaca."
        acao_produtor: "Ureia no máximo {@params.ureia_max}% da comida seca, sempre bem misturada."
  fonte: "Semadesc-MS"
  forca: B

- id: VER-05
  versao: 1
  modulo: verificacao
  descricao: Gordura da dieta acima de 6% da MS
  prioridade: 60
  cf: 0.8
  se:
    - {fato: dieta.ee_pct, op: ">", valor: $meta.ee_max}
  entao:
    - concluir: {fato: ver.excesso_gordura, valor: true}
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Gordura excessiva: EE {dieta.ee_pct:.1f}% da MS"
        causa: "Acima de ~{@params.ee_max}% a gordura prejudica a fermentação ruminal e pode derrubar a gordura do leite."
        acao: "Reduzir caroço de algodão ou outras fontes de gordura."
        titulo_produtor: "Gordura demais na dieta"
        causa_produtor: "Gordura em excesso atrapalha o rúmen e derruba a gordura do leite."
        acao_produtor: "Diminua o caroço de algodão ou outras fontes de gordura."
  fonte: "Cultivar"
  forca: C

- id: VER-06
  versao: 1
  modulo: verificacao
  descricao: MS ofertada muito acima do CMS previsto — dieta não será consumida
  prioridade: 60
  cf: 0.7
  se:
    - {fato: ver.razao_ms, op: ">", valor: "@params.fator_oferta_max"}
  entao:
    - concluir: {fato: ver.oferta_excessiva, valor: true}
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Oferta acima do consumo previsto ({dieta.ms_kg:.1f} kg MS contra {exig.cms:.1f})"
        causa: "Parte da dieta vai sobrar no cocho; a vaca escolhe o que come."
        acao: "Reduzir a oferta ou conferir a MS da silagem e o peso dos animais."
        titulo_produtor: "Está dando mais comida do que o lote consegue comer"
        causa_produtor: "A sobra vai para o lixo e as vacas escolhem o que comem."
        acao_produtor: "Diminua o trato ou confira a umidade da silagem e o peso das vacas."
  fonte: "Dossiê VER-06"
  forca: D

- id: VER-06B
  versao: 1
  modulo: verificacao
  descricao: MS ofertada abaixo do CMS possível — subalimentação
  prioridade: 60
  cf: 0.7
  se:
    - {fato: ver.razao_ms, op: "<", valor: "@params.fator_oferta_min"}
  entao:
    - concluir: {fato: ver.subalimentacao, valor: true}
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Oferta abaixo do consumo possível ({dieta.ms_kg:.1f} kg MS contra {exig.cms:.1f})"
        causa: "O lote poderia comer mais; produção limitada pela oferta."
        acao: "Aumentar o volumoso ofertado e acompanhar a leitura de cocho."
        titulo_produtor: "Está dando menos comida do que o lote poderia comer"
        causa_produtor: "O lote poderia comer mais; a produção fica limitada."
        acao_produtor: "Aumente o volumoso e acompanhe a leitura de cocho."
  fonte: "Escolha de engenharia"
  forca: D

- id: VER-07
  versao: 1
  modulo: verificacao
  descricao: Cana como único volumoso limita lotes de produção mais alta
  prioridade: 60
  cf: 0.7
  se:
    - {fato: dieta.cana_unico_volumoso, op: "=", valor: true}
    - {fato: lote.leite, op: ">", valor: "@params.leite_max_cana"}
  entao:
    - concluir: {fato: ver.volumoso_limitante, valor: true}
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Cana como único volumoso para {lote.leite:.0f} kg/vaca"
        causa: "FDN da cana é pouco digestível e limita o consumo."
        acao: "Associar silagem ou capim de melhor qualidade para lotes acima de {@params.leite_max_cana} kg."
        titulo_produtor: "Só cana como volumoso para {lote.leite:.0f} L por vaca"
        causa_produtor: "A fibra da cana é dura de digerir e limita o consumo."
        acao_produtor: "Junte silagem ou capim melhor na dieta para vacas acima de {@params.leite_max_cana} L."
  fonte: "Semadesc-MS"
  forca: C

- id: VER-09
  versao: 1
  modulo: verificacao
  descricao: CMS fora de 2,5–4% do PV — conferir dados de entrada
  prioridade: 60
  cf: 0.8
  se:
    - qualquer:
        - {fato: perfil.cms_pct_pv, op: "<", valor: "@params.cms_pct_pv_min"}
        - {fato: perfil.cms_pct_pv, op: ">", valor: "@params.cms_pct_pv_max"}
  entao:
    - alerta:
        nivel: informativo
        categoria: dados
        titulo: "Consumo previsto incomum ({perfil.cms_pct_pv:.1f}% do PV)"
        causa: "Consumo de vacas em lactação raramente sai de {@params.cms_pct_pv_min}–{@params.cms_pct_pv_max}% do peso vivo."
        acao: "Conferir peso vivo, produção e DEL informados."
        titulo_produtor: "Consumo previsto fora do comum"
        causa_produtor: "Vaca em lactação costuma comer entre {@params.cms_pct_pv_min}% e {@params.cms_pct_pv_max}% do peso."
        acao_produtor: "Confira peso, leite e dias de lactação no cadastro."
  fonte: "Dossiê"
  forca: C

- id: VER-10
  versao: 1
  modulo: verificacao
  descricao: Energia consumida muito acima da exigência — risco de engorda (ECC alto ao parto)
  prioridade: 60
  cf: 0.7
  se:
    - {fato: ver.razao_energia, op: ">", valor: "@params.fator_energia_max"}
  entao:
    - concluir: {fato: ver.excesso_energetico, valor: true}
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Energia acima do necessário: a dieta cobre {ver.razao_energia:.0%} da exigência"
        causa: "Excesso de energia engorda o lote; vaca gorda ao parto tem mais cetose e deslocamento de abomaso."
        acao: "Reduzir concentrado ou usar volumoso menos energético; especialmente em vacas secas e no final da lactação."
        titulo_produtor: "Energia sobrando: o lote vai engordar"
        causa_produtor: "Vaca gorda no parto tem mais cetose e deslocamento de abomaso."
        acao_produtor: "Diminua o concentrado ou use volumoso mais fraco."
  fonte: "Penn State; OMAFRA (ECC alto ao parto)"
  forca: C

- id: VER-11
  versao: 1
  modulo: verificacao
  descricao: ECC acima do máximo da fase
  prioridade: 60
  cf: 0.7
  se:
    - {fato: lote.ecc, op: ">", valor: $meta.ecc_max}
  entao:
    - concluir: {fato: ver.ecc_alto, valor: true}
    - alerta:
        nivel: atencao
        categoria: condicao_corporal
        titulo: "ECC {lote.ecc} acima da meta da fase (máx. {meta.ecc_max})"
        causa: "Lote engordando: risco metabólico no próximo parto."
        acao: "Reduzir a densidade energética da dieta desta fase."
        titulo_produtor: "Vacas gordas demais para a fase (escore {lote.ecc})"
        causa_produtor: "Gordura em excesso dá problema no próximo parto."
        acao_produtor: "Diminua a energia da dieta desta fase."
  fonte: "USC; Embrapa/IFRO; Dossiê ACP-09 (ajuste conforme direção do desvio)"
  forca: B

- id: VER-12
  versao: 1
  modulo: verificacao
  descricao: Alimento acima do limite de inclusão
  prioridade: 60
  cf: 0.8
  se:
    - {fato: dieta.inclusao_excedida, op: "!=", valor: []}
  entao:
    - concluir: {fato: ver.inclusao_excedida, valor: true}
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Alimento acima do limite de inclusão: {dieta.inclusao_excedida}"
        causa: "Cada alimento tem um teto prático na MS (ex.: caroço de algodão 15%, polpa cítrica 30%)."
        acao: "Reduzir esse alimento e completar com outro de função parecida."
        titulo_produtor: "Tem alimento passando do máximo seguro: {dieta.inclusao_excedida}"
        causa_produtor: "Cada alimento tem um máximo seguro na dieta."
        acao_produtor: "Diminua esse alimento e complete com outro parecido."
  fonte: "Limites de inclusão de foods.yaml"
  forca: C

- id: VER-13
  versao: 1
  modulo: verificacao
  descricao: Forragem de pastejo na dieta de lote confinado
  prioridade: 60
  se:
    - {fato: lote.sistema, op: "=", valor: confinado}
    - {fato: dieta.tem_pastejo, op: "=", valor: true}
  entao:
    - concluir: {fato: ver.pastejo_em_confinado, valor: true}
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Dieta de lote confinado com forragem de pastejo"
        causa: "Lote confinado não tem acesso ao pasto: essa parte da dieta não será consumida."
        acao: "Trocar por volumoso fornecido no cocho (silagem, capim picado, cana)."
        titulo_produtor: "Dieta de lote confinado com pasto"
        causa_produtor: "Lote confinado não vai ao pasto: essa parte não será comida."
        acao_produtor: "Troque por volumoso dado no cocho."
  fonte: "Definição do sistema de produção"
  forca: A

- id: VER-14
  versao: 1
  modulo: verificacao
  descricao: Dieta sem núcleo mineral
  prioridade: 60
  cf: 0.8
  se:
    - {fato: dieta.mineral_kg_ms, op: "<", valor: "@params.mineral_min_kg_ms"}
  entao:
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Sem núcleo mineral suficiente na dieta"
        causa: "Minerais (Ca, P, Mg, Na…) vêm do núcleo/sal mineral."
        acao: "Incluir núcleo mineral conforme o rótulo (mín. {@params.mineral_min_kg_ms} kg MS/vaca/dia)."
        titulo_produtor: "Falta sal mineral (núcleo) na dieta"
        causa_produtor: "Os minerais vêm do núcleo ou sal mineral."
        acao_produtor: "Inclua o núcleo mineral conforme o rótulo."
  fonte: "Rótulo do produto; Dossiê (minerais via núcleo)"
  forca: C

- id: VER-15
  versao: 1
  modulo: verificacao
  descricao: Pré-parto com multíparas e DCAD positiva — acidificar a dieta (DCAD negativa)
  prioridade: 60
  cf: 0.9
  se:
    - {fato: perfil.fase, op: "=", valor: pre_parto}
    - {fato: lote.fracao_primiparas, op: "<", valor: 1}
    - {fato: dieta.dcad_meq_kg, op: ">", valor: "@params.dcad_alerta_preparto"}
  entao:
    - concluir: {fato: ver.dcad_alta, valor: true}
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "DCAD do pré-parto em {dieta.dcad_meq_kg:+.0f} mEq/kg (meta ≈ {@params.dcad_meta_preparto} para multíparas)"
        causa: "DCAD positiva no pré-parto aumenta febre do leite, retenção de placenta e metrite nas multíparas."
        acao: "Reduzir potássio (volumoso com menos K) e incluir sal aniônico até a DCAD ficar negativa; conferir pH urinário."
        titulo_produtor: "A dieta do pré-parto não está aniônica"
        causa_produtor: "Sem isso, as vacas que já pariram têm mais febre do leite e retenção de placenta."
        acao_produtor: "Inclua sal aniônico e use volumoso com menos potássio; confira o pH da urina."
  fonte: "Santos et al. 2019 (meta-análise)"
  forca: A

- id: VER-15N
  versao: 1
  modulo: verificacao
  descricao: Lote de pré-parto só de novilhas com DCAD negativa — sem evidência de benefício
  prioridade: 60
  cf: 0.8
  se:
    - {fato: perfil.fase, op: "=", valor: pre_parto}
    - {fato: lote.fracao_primiparas, op: ">=", valor: 1}
    - {fato: dieta.dcad_meq_kg, op: "<", valor: 0}
  entao:
    - alerta:
        nivel: informativo
        categoria: dieta
