# Módulo D2 — Acompanhamento semanal: MS da silagem, cocho, ECC, fezes e ruminação (comportamento alimentar).
- id: ACP-S01
  versao: 1
  modulo: acompanhamento_semanal
  descricao: MS da silagem mudou 2 p.p. ou mais (confirmado) — recalcular kg de matéria natural
  prioridade: 70
  cf: 0.8
  se:
    - {fato: mon.ms_delta_abs, op: ">=", valor: "@params.ms_delta_recalcular"}
    - {fato: mon.ms_leituras_confirmadas, op: ">=", valor: 2}
  entao:
    - calcular: {fato: mon.silagem_kg_mn_novo, funcao: ms_para_mn, args: {kg_ms: $mon.silagem_kg_ms, ms_pct: $mon.ms_silagem_atual}}
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "MS da silagem mudou: {mon.ms_silagem_formulacao:.1f}% → {mon.ms_silagem_atual:.1f}%"
        causa: "Mantendo os mesmos kg de matéria natural, o lote recebe outra quantidade de MS de volumoso."
        acao: "Ajustar a silagem para {mon.silagem_kg_mn_novo:.1f} kg MN/vaca (era {mon.silagem_kg_mn_atual:.1f})."
  fonte: "Penn State (determinação de MS); heurística de 2 p.p."
  forca: C

- id: ACP-S02
  versao: 1
  modulo: acompanhamento_semanal
  descricao: MS mudou 5 p.p. ou mais, ou silo novo — reformular e pedir bromatologia
  prioridade: 70
  cf: 0.8
  se:
    - qualquer:
        - {fato: mon.ms_delta_abs, op: ">=", valor: "@params.ms_delta_reformular"}
        - {fato: mon.silo_novo, op: "=", valor: true}
  entao:
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Volumoso mudou muito: reformular a dieta"
        causa: "Mudança grande de MS ou silo novo muda a composição, não só a umidade."
        acao: "Pedir bromatologia do novo volumoso e reformular (use 'Sugerir dieta de custo mínimo')."
  fonte: "OSU Buckeye Dairy News"
  forca: B

- id: ACP-S03A
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Faixa-alvo de sobras para a fase do lote
  prioridade: 90
  se:
    - {fato: perfil.fase, op: existe}
    - {fato: mon.sobras_mm3, op: existe}
  entao:
    - calcular: {fato: meta.sobras, funcao: faixa, args: {chave: $perfil.fase, tabela: "@params.sobras_faixas"}}
  fonte: "eXtension (feed bunk management)"
  forca: B

- id: ACP-S03
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Sobras (média de 3 dias) abaixo da faixa — aumentar oferta
  prioridade: 60
  cf: 0.7
  se:
    - {fato: mon.sobras_mm3, op: "<", valor: $meta.sobras.min}
  entao:
    - alerta:
        nivel: atencao
        categoria: cocho
        titulo: "Sobras baixas: {mon.sobras_mm3:.1f}% (meta {meta.sobras.min:.0f}–{meta.sobras.max:.0f}%)"
        causa: "O lote está comendo tudo; o consumo pode estar limitado pela oferta."
        acao: "Aumentar a oferta em 2–3% e esperar 3 dias antes de novo ajuste."
  fonte: "eXtension; SDSU"
  forca: B

- id: ACP-S04
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Sobras (média de 3 dias) acima da faixa — reduzir oferta ou investigar seleção
  prioridade: 60
  cf: 0.7
  se:
    - {fato: mon.sobras_mm3, op: ">", valor: $meta.sobras.max}
  entao:
    - alerta:
        nivel: atencao
        categoria: cocho
        titulo: "Sobras altas: {mon.sobras_mm3:.1f}% (meta {meta.sobras.min:.0f}–{meta.sobras.max:.0f}%)"
        causa: "Oferta acima do consumo, rejeição ou seleção da dieta."
        acao: "Reduzir a oferta em 2–3% e observar se sobra a parte grossa (seleção)."
  fonte: "eXtension; SDSU; Dossiê ACP-07"
  forca: B

- id: ACP-06
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Cocho vazio por 2+ leituras em lote de alta ou recém-paridas
  prioridade: 70
  cf: 0.8
  se:
    - {fato: mon.dias_cocho_vazio, op: ">=", valor: "@params.cocho_vazio_dias"}
    - {fato: perfil.fase, op: in, valor: [recem_parida, inicio]}
  entao:
    - alerta:
        nivel: critico
        categoria: cocho
        titulo: "Cocho vazio há {mon.dias_cocho_vazio} leituras"
        causa: "Consumo possivelmente limitado num lote que precisa comer o máximo."
        acao: "Aumentar a oferta ~5% e empurrar o trato mais vezes ao dia."
  fonte: "Dossiê ACP-06; DeVries 2023"
  forca: C

- id: ACP-06B
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Cocho vazio por 2+ leituras nos demais lotes
  prioridade: 70
  cf: 0.7
  se:
    - {fato: mon.dias_cocho_vazio, op: ">=", valor: "@params.cocho_vazio_dias"}
    - {fato: perfil.fase, op: nao_in, valor: [recem_parida, inicio]}
  entao:
    - alerta:
        nivel: atencao
        categoria: cocho
        titulo: "Cocho vazio há {mon.dias_cocho_vazio} leituras"
        causa: "Oferta abaixo do consumo."
        acao: "Aumentar a oferta ~5%."
  fonte: "Dossiê ACP-06"
  forca: C

- id: ACP-05
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Perda de mais de 1 ponto de ECC no início da lactação — balanço energético negativo severo
  prioridade: 70
  cf: 0.8
  se:
    - {fato: perfil.fase, op: in, valor: [recem_parida, inicio]}
    - {fato: mon.ecc_perda, op: ">", valor: "@params.ecc_perda_severa"}
  entao:
    - concluir: {fato: hipotese.ben_severo, valor: true}
    - alerta:
        nivel: critico
        categoria: dieta
        titulo: "Balanço energético negativo severo: perdeu {mon.ecc_perda:.2f} ponto(s) de ECC"
        causa: "Perda acima de 1 ponto nas primeiras semanas atrasa a 1ª inseminação e aumenta doenças."
        acao: "Elevar a densidade energética, garantir acesso ao cocho; conferir a dieta de pré-parto."
  fonte: "Dossiê ACP-05; Carvalho et al. 2014"
  forca: B

- id: ACP-09
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Perda de ECC acima de 0,5 ponto
  prioridade: 60
  cf: 0.7
  se:
    - {fato: mon.ecc_perda, op: ">", valor: "@params.ecc_perda_atencao"}
    - {fato: hipotese.ben_severo, op: ausente}
  entao:
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Lote perdendo condição corporal ({mon.ecc_perda:.2f} ponto)"
        causa: "Energia da dieta abaixo da exigência do lote."
        acao: "Rever a energia da dieta (verificação) e a oferta no cocho."
  fonte: "OMAFRA"
  forca: B

- id: ACP-S05
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Ruminação média do lote caiu — falta de fibra efetiva, troca de dieta ou calor
  prioridade: 60
  cf: 0.5
  se:
    - {fato: mon.ruminacao_queda, op: ">=", valor: "@params.ruminacao_queda"}
  entao:
    - concluir: {fato: hipotese.acidose, valor: true}
  fonte: "Paudyal 2018 (queda coletiva = causa coletiva)"
  forca: C
