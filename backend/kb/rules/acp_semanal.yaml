# Módulo D2 — Acompanhamento semanal: MS da silagem, cocho, ECC, fezes e ruminação (comportamento alimentar).
- id: ACP-S01
  versao: 1
  modulo: acompanhamento_semanal
  descricao: MS da silagem mudou 2 p.p. ou mais (confirmado) — recalcular kg de matéria natural
  prioridade: 70
  cf: 0.8
  se:
    - {fato: mon.ms_delta_abs, op: ">=", valor: "@params.ms_delta_recalcular"}
    - {fato: mon.ms_leituras_confirmadas, op: ">=", valor: "@params.ms_leituras_confirmacao"}
  entao:
    - calcular: {fato: mon.silagem_kg_mn_novo, funcao: ms_para_mn, args: {kg_ms: $mon.silagem_kg_ms, ms_pct: $mon.ms_silagem_atual}}
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "MS da silagem mudou: {mon.ms_silagem_formulacao:.1f}% → {mon.ms_silagem_atual:.1f}%"
        causa: "Mantendo os mesmos kg de matéria natural, o lote recebe outra quantidade de MS de volumoso."
        acao: "Ajustar a silagem para {mon.silagem_kg_mn_novo:.1f} kg MN/vaca (era {mon.silagem_kg_mn_atual:.1f})."
  fonte: "Penn State (determinação de MS); heurística de 2 p.p."
  forca: C

- id: ACP-S02
  versao: 1
  modulo: acompanhamento_semanal
  descricao: MS mudou 5 p.p. ou mais, ou silo novo — reformular e pedir bromatologia
  prioridade: 70
  cf: 0.8
  se:
    - qualquer:
        - todos:
            - {fato: mon.ms_delta_abs, op: ">=", valor: "@params.ms_delta_reformular"}
            - {fato: mon.ms_leituras_confirmadas, op: ">=", valor: "@params.ms_leituras_confirmacao"}
        - {fato: mon.silo_novo, op: "=", valor: true}
  entao:
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Volumoso mudou muito: reformular a dieta"
        causa: "Mudança grande de MS ou silo novo muda a composição, não só a umidade."
        acao: "Pedir bromatologia do novo volumoso e reformular (use 'Sugerir dieta de custo mínimo')."
  fonte: "OSU Buckeye Dairy News"
  forca: B

- id: ACP-05
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Perda de mais de 1 ponto de ECC no início da lactação — balanço energético negativo severo
  prioridade: 70
  cf: 0.8
  se:
    - {fato: perfil.fase, op: in, valor: [recem_parida, inicio]}
    - {fato: mon.ecc_perda, op: ">", valor: "@params.ecc_perda_severa"}
  entao:
    - concluir: {fato: hipotese.ben_severo, valor: true}
    - alerta:
        nivel: critico
        categoria: dieta
        titulo: "Balanço energético negativo severo: perdeu {mon.ecc_perda:.2f} ponto(s) de ECC"
        causa: "Perda acima de 1 ponto nas primeiras semanas atrasa a 1ª inseminação e aumenta doenças."
        acao: "Elevar a densidade energética, garantir acesso ao cocho; conferir a dieta de pré-parto."
  fonte: "Dossiê ACP-05; Carvalho et al. 2014"
  forca: B

- id: ACP-09
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Perda de ECC acima de 0,5 ponto
  prioridade: 60
  cf: 0.7
  se:
    - {fato: mon.ecc_perda, op: ">", valor: "@params.ecc_perda_atencao"}
    - {fato: hipotese.ben_severo, op: ausente}
  entao:
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Lote perdendo condição corporal ({mon.ecc_perda:.2f} ponto)"
        causa: "Energia da dieta abaixo da exigência do lote."
        acao: "Rever a energia da dieta (verificação) e a oferta no cocho."
  fonte: "OMAFRA"
  forca: B

- id: ACP-S05
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Ruminação média do lote caiu — falta de fibra efetiva, troca de dieta ou calor
  prioridade: 60
  cf: 0.5
  se:
    - {fato: mon.ruminacao_queda, op: ">=", valor: "@params.ruminacao_queda"}
  entao:
    - concluir: {fato: hipotese.acidose, valor: true}
  fonte: "Paudyal 2018 (queda coletiva = causa coletiva)"
  forca: C

- id: ACP-12
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Lote entrou nos 190 dias de gestação — a exigência de gestação começa a contar
  prioridade: 60
  se:
    - {fato: perfil.dias_gestacao, op: ">=", valor: "@params.gestacao_dias_exigencia"}
    - {fato: perfil.dias_gestacao, op: "<=", valor: "@params.aviso_gestacao_ate"}
  entao:
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Gestação chegou a {perfil.dias_gestacao:.0f} dias: exigências aumentaram"
        causa: "A partir de 190 dias a gestação soma energia e proteína metabolizável à exigência do lote."
        acao: "Rever a dieta (verificar ou sugerir custo mínimo) para incluir a exigência de gestação."
  fonte: "NRC 2001 via AgModel; Dossiê ACP-12"
  forca: B

- id: ACP-SEC
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Lote em lactação a ~60 dias do parto previsto — programar a secagem
  prioridade: 60
  se:
    - {fato: lote.estado, op: "=", valor: lactacao}
    - {fato: perfil.dias_gestacao, op: ">=", valor: "@params.dias_gestacao_secagem"}
  entao:
    - calcular: {fato: mon.dias_para_parto_previsto, funcao: diferenca, args: {a: "@params.gestacao_duracao", b: $perfil.dias_gestacao}}
    - alerta:
        nivel: atencao
        categoria: manejo
        titulo: "Programar a secagem: parto previsto em ~{mon.dias_para_parto_previsto:.0f} dias"
        causa: "Período seco recomendado de 50–60 dias antes do parto."
        acao: "Secar as vacas, mover para o lote de vacas secas e usar dieta de vaca seca."
  fonte: "Inferências nº 36; Embrapa Doc 286 (período seco 50–60 d)"
  forca: A

- id: ACP-PRE
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Lote seco a 21 dias do parto — dieta de pré-parto; DCAD negativa só para multíparas
  prioridade: 60
  se:
    - {fato: lote.estado, op: "=", valor: seca}
    - {fato: perfil.fase, op: "=", valor: pre_parto}
  entao:
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Lote no pré-parto ({lote.dias_para_parto:.0f} dias para o parto)"
        causa: "Nas 3 semanas antes do parto a dieta de transição reduz febre do leite, retenção de placenta e metrite."
        acao: "Dieta de pré-parto (PB ~14%, CMS 1,8–2% do PV). DCAD negativa (−100 mEq/kg) só para as multíparas; para novilhas não há evidência."
  fonte: "Santos et al. 2019 (meta-análise); Inferências nº 36"
  forca: A

- id: ACP-11
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Lote a pasto perdendo ECC e caminhando mais — gasto de atividade pode estar subestimado
  prioridade: 55
  cf: 0.5
  se:
    - {fato: lote.sistema, op: in, valor: [pasto, semiconfinado]}
    - {fato: mon.ecc_perda, op: ">", valor: "@params.ecc_perda_atencao"}
    - {fato: mon.distancia_delta, op: ">=", valor: "@params.distancia_aumento"}
  entao:
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Caminhada aumentou {mon.distancia_delta:.1f} km/dia e o lote perde condição"
        causa: "O gasto de energia com atividade de pastejo cresce com a distância e o relevo."
        acao: "Atualizar a distância e o relevo no cadastro do lote para recalcular a exigência; rever a energia da dieta."
  fonte: "Dossiê ACP-11; NRC 2001 via eOrganic"
  forca: C

- id: ACP-P0
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Metas de altura do pasto para a forrageira do lote
  prioridade: 90
  se:
    - {fato: lote.forrageira, op: existe}
    - {fato: lote.sistema, op: in, valor: [pasto, semiconfinado]}
  entao:
    - calcular: {fato: meta.altura, funcao: metas_altura, args: {forrageira: $lote.forrageira, tabela: "@params.alturas_pasto", tolerancia: "@params.altura_tolerancia"}}
  fonte: "Embrapa (Lopes; Gomide 2011)"
  forca: C

- id: ACP-P1
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Entrada no piquete com o pasto alto demais — forragem passada
  prioridade: 60
  cf: 0.7
  se:
    - {fato: mon.altura_entrada, op: ">", valor: $meta.altura.entrada_max}
  entao:
    - alerta:
        nivel: atencao
        categoria: pasto
        titulo: "Pasto passado na entrada: {mon.altura_entrada:.0f} cm (máx. {meta.altura.entrada_max:.0f})"
        causa: "Acima da altura de entrada a forragem perde qualidade (mais colmo, menos folha)."
        acao: "Entrar mais cedo nos piquetes ou aumentar a lotação."
  fonte: "Embrapa (Lopes) — 95% de interceptação luminosa"
  forca: C

- id: ACP-P2
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Saída do piquete com o pasto baixo demais — superpastejo
  prioridade: 60
  cf: 0.7
  se:
    - {fato: mon.altura_saida, op: "<", valor: $meta.altura.saida_min}
  entao:
    - alerta:
        nivel: atencao
        categoria: pasto
        titulo: "Superpastejo: saída a {mon.altura_saida:.0f} cm (mín. {meta.altura.saida_min:.0f})"
        causa: "Rebaixar demais o pasto reduz o consumo das vacas e a rebrota."
        acao: "Tirar o lote mais cedo, reduzir a lotação ou suplementar volumoso."
  fonte: "Embrapa (Lopes)"
  forca: C

- id: ACP-P3
  versao: 1
  modulo: acompanhamento_semanal
  descricao: Pastejo contínuo com altura média fora da meta
  prioridade: 60
  cf: 0.7
  se:
    - qualquer:
        - {fato: mon.altura_media, op: "<", valor: $meta.altura.media_min}
        - {fato: mon.altura_media, op: ">", valor: $meta.altura.media_max}
  entao:
    - alerta:
        nivel: atencao
        categoria: pasto
        titulo: "Altura média do pasto {mon.altura_media:.0f} cm fora da meta ({meta.altura.media_min:.0f}–{meta.altura.media_max:.0f})"
        causa: "Abaixo da meta: superpastejo; acima: subpastejo e perda de qualidade."
        acao: "Ajustar a lotação (ou a área) para manter a altura na meta."
  fonte: "Gomide 2011 (braquiária em lotação contínua: 25 cm)"
  forca: C
