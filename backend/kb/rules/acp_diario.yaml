# Módulo D1 — Acompanhamento diário: litros/vaca × esperado pela curva, persistência, calor e concentrado.
# Os fatos mon.* vêm do monitor de séries (app/monitor) a partir dos registros diários do lote.
- id: ACP-D00
  versao: 1
  modulo: acompanhamento_diario
  descricao: Dia sem registro gera lembrete, nunca alerta zootécnico
  prioridade: 95
  se:
    - {fato: mon.sem_registro_hoje, op: "=", valor: true}
  entao:
    - alerta:
        nivel: informativo
        categoria: registro
        titulo: "Sem registro de hoje"
        causa: "Sem os números do dia o sistema não consegue comparar com o esperado."
        acao: "Registrar nº de vacas, litros e kg de concentrado do lote."
  fonte: "de Mol et al. 2012 (dado faltante não é alerta)"
  forca: D

- id: ACP-D00B
  versao: 1
  modulo: acompanhamento_diario
  descricao: Curva da fazenda ainda em calibração — sem alertas de produção até ter dias suficientes
  prioridade: 95
  se:
    - {fato: mon.calibrando_dias, op: existe}
  entao:
    - alerta:
        nivel: informativo
        categoria: registro
        titulo: "Calibrando a curva de lactação do lote ({mon.calibrando_dias} dia(s) de registro)"
        causa: "A produção esperada é ajustada à fazenda com pelo menos {@params.calibracao_dias_min} dias sem calor forte."
        acao: "Continue registrando; os alertas de queda começam após a calibração."
        titulo_produtor: "Ainda aprendendo a produção normal deste lote ({mon.calibrando_dias} dia(s) de registro)"
        causa_produtor: "O sistema precisa de alguns dias de anotação para saber quanto este lote costuma produzir."
        acao_produtor: "Continue anotando o leite todo dia; os avisos de queda começam depois disso."
  fonte: "Inferências (ajuste da escala da curva nas primeiras semanas)"
  forca: D

- id: ACP-D01
  versao: 1
  modulo: acompanhamento_diario
  descricao: Queda brusca de um dia (resíduo abaixo de −3σ) sem queda sustentada em curso
  prioridade: 50
  cf: 0.7
  se:
    - {fato: mon.z, op: "<", valor: "@params.shewhart_z"}
    - {fato: hipotese.queda_sustentada, op: ausente}
  entao:
    - alerta:
        nivel: atencao
        categoria: producao
        titulo: "Queda brusca hoje: {mon.litros_vaca:.1f} L/vaca contra {mon.esperado_vaca:.1f} esperados"
        causa: "Um dia isolado muito abaixo costuma ser falha de ordenha, erro de registro ou tanque não coletado."
        acao: "Conferir o registro e a ordenha antes de mexer na dieta."
        titulo_produtor: "O leite caiu de repente hoje: {mon.litros_vaca:.1f} L por vaca (o normal seria {mon.esperado_vaca:.1f})"
        causa_produtor: "Queda de um dia só costuma ser problema na ordenha, erro na anotação ou leite que não foi para o tanque."
        acao_produtor: "Confira a anotação e a ordenha antes de mexer na comida."
  fonte: "SPC (Shewhart) sobre resíduo padronizado"
  forca: D

- id: ACP-D02
  versao: 1
  modulo: acompanhamento_diario
  descricao: Corrida de dias abaixo do esperado com ao menos um dia abaixo de −10%
  prioridade: 70
  cf: 0.8
  se:
    - {fato: mon.corrida_dias, op: ">=", valor: "@params.corrida_dias_min"}
    - {fato: mon.corrida_pior, op: "<=", valor: "@params.corrida_queda_min"}
    - {fato: mon.residuo, op: "<", valor: "@params.residuo_queda_atual"}
  entao:
    - concluir: {fato: hipotese.queda_sustentada, valor: true}
  fonte: "Frontiers in Genetics 2022 (perturbação de lactação, definida por vaca com ≥10 dias); adaptada ao lote (D)"
  forca: C

- id: ACP-D03
  versao: 1
  modulo: acompanhamento_diario
  descricao: EWMA do resíduo abaixo do limite inferior (queda sustentada de 3–5%)
  prioridade: 70
  cf: 0.6
  se:
    - {fato: mon.ewma, op: "<", valor: $mon.ewma_limite_inf}
    - {fato: mon.residuo, op: "<", valor: "@params.residuo_queda_atual"}
  entao:
    - concluir: {fato: hipotese.queda_sustentada, valor: true}
  fonte: "Archiv Tierzucht 2009; SPC"
  forca: C

- id: ACP-D03B
  versao: 1
  modulo: acompanhamento_diario
  descricao: Queda de mais de 10% em 7 dias
  prioridade: 70
  cf: 0.6
  se:
    - {fato: mon.queda_7d, op: "<=", valor: "@params.queda_7d"}
    - {fato: mon.residuo, op: "<", valor: "@params.residuo_queda_atual"}
  entao:
    - concluir: {fato: hipotese.queda_sustentada, valor: true}
  fonte: "Dossiê ACP-08/ACP-10"
  forca: C

- id: ACP-D04
  versao: 1
  modulo: acompanhamento_diario
  descricao: Alerta de queda sustentada de produção (CF combinado das evidências)
  prioridade: 40
  se:
    - {fato: hipotese.queda_sustentada, op: "=", valor: true}
  entao:
    - alerta:
        nivel: critico
        categoria: producao
        cf_de: hipotese.queda_sustentada
        titulo: "Queda sustentada de produção: {mon.litros_vaca:.1f} L/vaca ({mon.residuo:.0%} do esperado)"
        causa: "{mon.corrida_dias} dia(s) seguidos abaixo da curva esperada para o DEL do lote."
        acao: "Checar silagem/MS, ITU, vacas doentes e mudanças registradas na semana."
        titulo_produtor: "O leite está caindo há vários dias: {mon.litros_vaca:.1f} L por vaca"
        causa_produtor: "Hoje o lote está {mon.residuo:+.0%} em relação ao normal para esta fase, e a queda não é de um dia só."
        acao_produtor: "Veja a silagem, o calor, vacas doentes e o que mudou na semana."
  fonte: "Frontiers in Genetics 2022; de Mol 2012 (persistência); adaptada ao lote (D)"
  forca: C

- id: ACP-08
  versao: 1
  modulo: acompanhamento_diario
  descricao: Queda logo após troca de volumoso — causa provável é o novo volumoso
  prioridade: 60
  cf: 0.6
  se:
    - {fato: hipotese.queda_sustentada, op: "=", valor: true}
    - {fato: mon.dias_desde_troca_volumoso, op: "<=", valor: "@params.janela_troca_volumoso"}
  entao:
    - concluir: {fato: hipotese.causa_volumoso, valor: true}
    - alerta:
        nivel: atencao
        categoria: dieta_queda
        titulo: "Causa provável da queda: troca de volumoso há {mon.dias_desde_troca_volumoso} dia(s)"
        causa: "Degrau de produção 1–3 dias após a troca, só neste lote."
        acao: "Medir a MS do novo volumoso, recalcular os kg de matéria natural e pedir bromatologia (com FDND)."
        titulo_produtor: "A queda parece vir da troca do volumoso ({mon.dias_desde_troca_volumoso} dia(s) atrás)"
        causa_produtor: "O leite caiu logo depois que o volumoso foi trocado, só neste lote."
        acao_produtor: "Meça a umidade do volumoso novo, ajuste os kg no trato e mande uma amostra para análise."
  fonte: "Dossiê ACP-08; Inferências (assinatura de troca de silagem)"
  forca: C

- id: ACP-10
  versao: 1
  modulo: acompanhamento_diario
  descricao: Queda de produção com ITU alto nos 2 dias anteriores — causa provável é calor, não a dieta
  prioridade: 60
  cf: 0.6
  se:
    - qualquer:
        - {fato: hipotese.queda_sustentada, op: "=", valor: true}
        - {fato: mon.queda_7d, op: "<=", valor: "@params.queda_7d"}
    - {fato: mon.itu_2d, op: ">", valor: $mon.itu_limiar}
    - qualquer:
        - {fato: mon.dias_desde_troca_volumoso, op: ausente}
        - {fato: mon.dias_desde_troca_volumoso, op: ">", valor: "@params.janela_troca_volumoso"}
    - {fato: hipotese.mastite, op: ausente}
  entao:
    - concluir: {fato: hipotese.causa_calor, valor: true}
    - alerta:
        nivel: atencao
        categoria: calor
        titulo: "Calor explica a queda (ITU médio de 2 dias = {mon.itu_2d:.1f})"
        causa: "Queda acompanhando ITU acima de {mon.itu_limiar:.0f}, sem troca recente de dieta."
        acao: "Sombra, aspersão, água e tratos nas horas frescas antes de mudar a dieta."
        titulo_produtor: "O calor explica a queda do leite"
        causa_produtor: "Os dois últimos dias foram quentes e abafados para as vacas, e a comida não mudou."
        acao_produtor: "Sombra, água à vontade, molhar as vacas e tratar nas horas frescas. Não precisa mudar a dieta."
  fonte: "Dossiê ACP-10; Negri 2021; LUME UFRGS"
  forca: B

- id: ACP-D05
  versao: 1
  modulo: acompanhamento_diario
  descricao: Menos de 2 litros por kg de concentrado
  prioridade: 60
  cf: 0.6
  se:
    - {fato: mon.litros_por_kg_conc, op: "<", valor: "@params.litros_por_kg_conc_min"}
  entao:
    - alerta:
        nivel: atencao
        categoria: economia
        titulo: "Baixa eficiência do concentrado: {mon.litros_por_kg_conc:.1f} L/kg"
        causa: "Excesso de suplementação ou volumoso/pasto limitante."
        acao: "Rever a quantidade de concentrado por vaca e checar o volumoso."
        titulo_produtor: "Pouco leite para o concentrado gasto: {mon.litros_por_kg_conc:.1f} L por kg"
        causa_produtor: "Pode estar sobrando concentrado ou faltando volumoso ou pasto bom."
        acao_produtor: "Reveja quanto concentrado cada vaca recebe e confira o volumoso."
  fonte: "Inferências (C/D)"
  forca: D

- id: ACP-D06
  versao: 1
  modulo: acompanhamento_diario
  descricao: Resposta ao último aumento de concentrado não paga o custo
  prioridade: 60
  cf: 0.8
  se:
    - {fato: mon.resposta_marginal, op: existe}
    - {fato: mon.resposta_marginal, op: "<", valor: $mon.razao_precos}
  entao:
    - alerta:
        nivel: atencao
        categoria: economia
        titulo: "Concentrado extra não se paga: {mon.resposta_marginal:+.2f} L por kg"
        causa: "Cada kg a mais de concentrado precisa render {mon.razao_precos:.2f} L para se pagar (preço conc./preço leite)."
        acao: "Voltar ao nível anterior de concentrado; em mestiças de baixa produção o ótimo costuma ficar abaixo de 1 kg/vaca."
        titulo_produtor: "O concentrado a mais não está se pagando"
        causa_produtor: "Cada kg extra rendeu {mon.resposta_marginal:+.2f} L, mas precisaria render {mon.razao_precos:.2f} L para cobrir o preço."
        acao_produtor: "Volte para a quantidade de concentrado de antes."
  fonte: "de Abreu, Lana et al. 2013 (resposta marginal 0,15–0,97 kg/kg)"
  forca: B

- id: ACP-D07
  versao: 1
  modulo: acompanhamento_diario
  descricao: Custo de concentrado por litro acima da mediana de 30 dias
  prioridade: 50
  cf: 0.6
  se:
    - {fato: mon.custo_conc_litro, op: existe}
    - {fato: mon.custo_conc_litro_ref, op: existe}
    - {fato: mon.custo_conc_razao, op: ">", valor: "@params.custo_conc_litro_tolerancia"}
  entao:
    - alerta:
        nivel: informativo
        categoria: economia
        titulo: "Custo de concentrado subiu: R$ {mon.custo_conc_litro:.2f}/L (ref. R$ {mon.custo_conc_litro_ref:.2f})"
        causa: "Mais concentrado por litro produzido do que no último mês."
        acao: "Rever alocação e preços; conferir se a produção caiu."
        titulo_produtor: "O concentrado está custando mais por litro: R$ {mon.custo_conc_litro:.2f} (antes R$ {mon.custo_conc_litro_ref:.2f})"
        causa_produtor: "Está indo mais concentrado para cada litro do que no último mês."
        acao_produtor: "Reveja quanto concentrado vai para cada lote e os preços; veja se o leite caiu."
  fonte: "Penn State (IOFC); Inferências"
  forca: D

- id: ACP-D08
  versao: 1
  modulo: acompanhamento_diario
  descricao: Custo de toda a alimentação acima de 60% da receita do leite
  prioridade: 50
  cf: 0.7
  se:
    - {fato: mon.alimento_pct_receita, op: ">", valor: "@params.alimento_pct_receita_max"}
  entao:
    - alerta:
        nivel: atencao
        categoria: economia
        titulo: "Alimentação consome {mon.alimento_pct_receita:.0f}% da receita (IOFC R$ {mon.iofc:.2f}/vaca/dia)"
        causa: "Com a alimentação acima de ~{@params.alimento_pct_receita_max}% da receita, a margem sobre o alimento (IOFC) fica baixa."
        acao: "Rever preços, sobras e a dieta (a sugestão de custo mínimo pode baixar o custo)."
        titulo_produtor: "A comida está levando {mon.alimento_pct_receita:.0f}% do dinheiro do leite"
        causa_produtor: "Sobram R$ {mon.iofc:.2f} por vaca por dia depois de pagar a comida; acima de {@params.alimento_pct_receita_max}% da receita a margem fica apertada."
        acao_produtor: "Confira preços e sobras e peça a sugestão de dieta mais barata."
  fonte: "Penn State (IOFC)"
  forca: C

- id: ACP-EA0
  versao: 1
  modulo: acompanhamento_diario
  descricao: Eficiência alimentar com consumo MEDIDO (oferta − sobras) — leite corrigido para energia / CMS
  prioridade: 90
  se:
    - {fato: mon.cms_medido, op: ">", valor: 0}
    - {fato: mon.litros_vaca, op: existe}
  entao:
    - calcular: {fato: mon.ecm, funcao: ecm, args: {leite: $mon.litros_vaca, gordura: $lote.gordura, proteina: $lote.proteina}}
    - calcular: {fato: mon.ea, funcao: razao, args: {a: $mon.ecm, b: $mon.cms_medido}}
  fonte: "Penn State (ECM); eXtension (eficiência alimentar)"
  forca: B

- id: ACP-EA1
  versao: 1
  modulo: acompanhamento_diario
  descricao: Eficiência alimentar baixa no meio da lactação
  prioridade: 55
  cf: 0.6
  se:
    - {fato: lote.del, op: entre, valor: "@params.ea_del_faixa"}
    - {fato: lote.grupo_genetico, op: nao_in, valor: "@params.grupos_zebuinos"}   # a referência é de Holandesas
    - {fato: mon.ea, op: "<", valor: "@params.ea_min_meio"}
  entao:
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Eficiência alimentar baixa: {mon.ea:.2f} kg de leite corrigido por kg de MS"
        causa: "Abaixo de {@params.ea_min_meio} no meio da lactação a dieta rende pouco leite por kg consumido (referência de Holandesas)."
        acao: "Conferir digestibilidade do volumoso, sobras e balanceamento; comparar com o histórico do próprio lote."
        titulo_produtor: "As vacas estão rendendo pouco leite para o que comem"
        causa_produtor: "Cada kg de comida seca está virando só {mon.ea:.2f} kg de leite."
        acao_produtor: "Confira a qualidade do volumoso, as sobras e o balanceamento da dieta."
  fonte: "eXtension (Holandesas EUA — comparar com o histórico do lote)"
  forca: C

- id: ACP-EA2
  versao: 1
  modulo: acompanhamento_diario
  descricao: Eficiência alimentar alta demais no início — vacas tirando energia do corpo
  prioridade: 55
  cf: 0.6
  se:
    - {fato: perfil.fase, op: in, valor: [recem_parida, inicio]}
    - {fato: mon.ea, op: ">", valor: "@params.ea_max_inicio"}
  entao:
    - alerta:
        nivel: atencao
        categoria: dieta
        titulo: "Eficiência {mon.ea:.2f} no início da lactação: perda de peso excessiva"
        causa: "EA acima de {@params.ea_max_inicio} no início indica leite produzido à custa de reserva corporal, não mérito da dieta."
        acao: "Elevar a densidade energética e acompanhar o ECC."
        titulo_produtor: "As recém-paridas estão tirando leite do próprio corpo"
        causa_produtor: "Estão produzindo muito para o que comem: estão emagrecendo."
        acao_produtor: "Dê uma dieta mais forte (mais energia) e acompanhe o escore corporal."
  fonte: "eXtension"
  forca: C

# --- Leitura de cocho (diária, antes do 1º trato): escore 1–5 ou sobras pesadas ---
- id: ACP-S03A
  versao: 1
  modulo: acompanhamento_diario
  descricao: Faixa-alvo de sobras para a fase do lote
  prioridade: 90
  se:
    - {fato: perfil.fase, op: existe}
    - {fato: mon.sobras_min3, op: existe}
  entao:
    - calcular: {fato: meta.sobras, funcao: faixa, args: {chave: $perfil.fase, tabela: "@params.sobras_faixas"}}
  fonte: "Inferências (adaptado de eXtension, feed bunk management)"
  forca: C

- id: ACP-S03
  versao: 1
  modulo: acompanhamento_diario
  descricao: Cocho abaixo da faixa nos 3 últimos dias (escore ou pesagem) — aumentar oferta
  prioridade: 60
  cf: 0.7
  se:
    - {fato: mon.sobras_max3, op: "<", valor: $meta.sobras.min}
  entao:
    - alerta:
        problema: cocho_baixo
        ajuste: {tipo: oferta, pct: "@params.sobras_ajuste_leve_pct"}
        nivel: atencao
        categoria: cocho
        titulo: "Sobras baixas: {mon.sobras_texto}; meta {meta.sobras.min:.0f}–{meta.sobras.max:.0f}% (escore 3)"
        causa: "O lote está comendo tudo; o consumo pode estar limitado pela oferta."
        acao: "Aumentar a oferta em ~{@params.sobras_ajuste_leve_pct}% e esperar {@params.sobras_dias} dias antes de novo ajuste."
        titulo_produtor: "As vacas estão limpando o cocho: {mon.sobras_texto}"
        causa_produtor: "O lote come tudo; pode estar faltando comida."
        acao_produtor: "Aumente o trato em uns {@params.sobras_ajuste_leve_pct}% e espere {@params.sobras_dias} dias antes de mexer de novo."
  fonte: "Inferências (adaptado de eXtension; ajustar só após 3 dias fora da meta)"
  forca: C

- id: ACP-S04
  versao: 1
  modulo: acompanhamento_diario
  descricao: Cocho acima da faixa nos 3 últimos dias (escore ou pesagem) — reduzir oferta ou investigar seleção
  prioridade: 60
  cf: 0.7
  se:
    - {fato: mon.sobras_min3, op: ">", valor: $meta.sobras.max}
  entao:
    - alerta:
        problema: cocho_alto
        ajuste: {tipo: oferta, pct: "@params.sobras_ajuste_leve_pct", sentido: -1}
        nivel: atencao
        categoria: cocho
        titulo: "Sobras altas: {mon.sobras_texto}; meta {meta.sobras.min:.0f}–{meta.sobras.max:.0f}% (escore 3)"
        causa: "Oferta acima do consumo, rejeição ou seleção da dieta."
        acao: "Reduzir a oferta em ~{@params.sobras_ajuste_leve_pct}% e observar se sobra a parte grossa (seleção)."
        titulo_produtor: "Está sobrando muita comida no cocho: {mon.sobras_texto}"
        causa_produtor: "A oferta está maior que o consumo, ou as vacas estão escolhendo o que comem."
        acao_produtor: "Diminua o trato em uns {@params.sobras_ajuste_leve_pct}% e veja se sobra só a parte grossa."
  fonte: "Inferências (adaptado de eXtension); Dossiê ACP-07"
  forca: C

- id: ACP-06
  versao: 1
  modulo: acompanhamento_diario
  descricao: Cocho vazio por 2+ leituras em lote de alta ou recém-paridas
  prioridade: 70
  cf: 0.8
  se:
    - {fato: mon.dias_cocho_vazio, op: ">=", valor: "@params.cocho_vazio_dias"}
    - {fato: perfil.fase, op: in, valor: [recem_parida, inicio]}
  entao:
    - alerta:
        problema: cocho_baixo
        ajuste: {tipo: oferta, pct: "@params.sobras_ajuste_pct"}
        nivel: critico
        categoria: cocho
        titulo: "Cocho vazio há {mon.dias_cocho_vazio} leituras"
        causa: "Consumo possivelmente limitado num lote que precisa comer o máximo."
        acao: "Aumentar a oferta ~{@params.sobras_ajuste_pct}% e empurrar o trato mais vezes ao dia."
        titulo_produtor: "O cocho amanheceu vazio em {mon.dias_cocho_vazio} leituras seguidas"
        causa_produtor: "Vacas recém-paridas ou de alta produção precisam comer o máximo."
        acao_produtor: "Aumente o trato uns {@params.sobras_ajuste_pct}% e empurre a comida mais vezes por dia."
  fonte: "Dossiê ACP-06; DeVries 2023"
  forca: C

- id: ACP-06B
  versao: 1
  modulo: acompanhamento_diario
  descricao: Cocho vazio por 2+ leituras nos demais lotes
  prioridade: 70
  cf: 0.7
  se:
    - {fato: mon.dias_cocho_vazio, op: ">=", valor: "@params.cocho_vazio_dias"}
    - {fato: perfil.fase, op: nao_in, valor: [recem_parida, inicio]}
  entao:
    - alerta:
        problema: cocho_baixo
        ajuste: {tipo: oferta, pct: "@params.sobras_ajuste_pct"}
        nivel: atencao
        categoria: cocho
        titulo: "Cocho vazio há {mon.dias_cocho_vazio} leituras"
        causa: "Oferta abaixo do consumo."
        acao: "Aumentar a oferta ~{@params.sobras_ajuste_pct}%."
        titulo_produtor: "O cocho amanheceu vazio em {mon.dias_cocho_vazio} leituras seguidas"
        causa_produtor: "A comida não está dando para o lote."
        acao_produtor: "Aumente o trato uns {@params.sobras_ajuste_pct}%."
  fonte: "Dossiê ACP-06"
  forca: C

- id: ACP-TR1
  versao: 1
  modulo: acompanhamento_diario
