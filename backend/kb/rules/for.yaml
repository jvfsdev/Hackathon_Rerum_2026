# Módulo F — Formulação: as regras definem metas e restrições do PL; depois diagnosticam o resultado.
- id: FOR-01
  versao: 1
  modulo: formulacao
  descricao: Faixa de matéria seca do PL — mesmos limites de oferta que a verificação usa (VER-06/06B)
  prioridade: 80
  se:
    - {fato: formulacao.solicitada, op: "=", valor: true}
    - {fato: exig.cms, op: existe}
  entao:
    - calcular: {fato: pl.ms_min, funcao: produto, args: {a: $exig.cms, b: "@params.pl_fator_ms_min"}}
    - calcular: {fato: pl.ms_max, funcao: produto, args: {a: $exig.cms, b: "@params.fator_oferta_max"}}
  fonte: "Inferências (CMS ± 5%); Dossiê VER-06"
  forca: D

- id: FOR-02
  versao: 1
  modulo: formulacao
  descricao: Energia mínima do PL = exigência × fator de tolerância
  prioridade: 80
  se:
    - {fato: formulacao.solicitada, op: "=", valor: true}
    - {fato: exig.ell_total, op: existe}
  entao:
    - calcular: {fato: pl.ell_min, funcao: produto, args: {a: $exig.ell_total, b: "$meta.fator_energia_min|@params.fator_energia_min"}}
  fonte: "Dossiê VER-01"
  forca: D

- id: FOR-02B
  versao: 1
  modulo: formulacao
  descricao: Energia máxima do PL — o mesmo teto que a verificação usa para apontar excesso (VER-10)
  prioridade: 80
  se:
    - {fato: formulacao.solicitada, op: "=", valor: true}
    - {fato: exig.ell_total, op: existe}
  entao:
    - calcular: {fato: pl.ell_max, funcao: produto, args: {a: $exig.ell_total, b: "@params.fator_energia_max"}}
  fonte: "Dossiê VER-10"
  forca: D

- id: FOR-03
  versao: 1
  modulo: formulacao
  descricao: Faixa de PB do PL = alvo até o máximo que a verificação aceita sem apontar excesso (VER-02B)
  prioridade: 80
  se:
    - {fato: formulacao.solicitada, op: "=", valor: true}
    - {fato: exig.pb_pct_alvo, op: existe}
  entao:
    - concluir: {fato: pl.pb_min, valor: $exig.pb_pct_alvo}
    - calcular: {fato: pl.pb_max, funcao: produto, args: {a: $exig.pb_pct_alvo, b: "@params.fator_pb_max"}}
  fonte: "MSD Vet Manual (PB alvo); teto de PB: escolha de engenharia"
  forca: D

- id: FOR-04
  versao: 1
  modulo: formulacao
  descricao: Teto de consumo de FDN (kg/dia) = 1,25% do PV
  prioridade: 80
  se:
    - {fato: formulacao.solicitada, op: "=", valor: true}
    - {fato: lote.pv, op: existe}
  entao:
    - calcular: {fato: pl.fdn_max_kg, funcao: pct_de, args: {valor: $lote.pv, pct: "@params.teto_fdn_pct_pv"}}
  fonte: "Mertens via Epagri"
  forca: B

- id: FOR-05
  versao: 1
  modulo: formulacao
  descricao: Lote acima de 15 kg/vaca não pode ter cana como único volumoso — limitar a cana no PL
  prioridade: 80
  se:
    - {fato: formulacao.solicitada, op: "=", valor: true}
    - {fato: lote.leite, op: ">", valor: "@params.leite_max_cana"}
  entao:
    - concluir: {fato: pl.cana_max_pct_volumoso, valor: "@params.cana_max_pct_volumoso"}
  fonte: "Semadesc-MS (mesma base da VER-07)"
  forca: C

- id: FOR-06
  versao: 1
  modulo: formulacao
  descricao: Lote confinado não pasteja — excluir forragens de pastejo do PL
  prioridade: 80
  se:
    - {fato: formulacao.solicitada, op: "=", valor: true}
    - {fato: lote.sistema, op: "=", valor: confinado}
  entao:
    - concluir: {fato: pl.excluir_pastejo, valor: true}
  fonte: "Definição do sistema de produção"
  forca: A

- id: FOR-07
  versao: 1
  modulo: formulacao
  descricao: Pré-parto com multíparas — DCAD máxima do PL (a mesma da verificação VER-15)
  prioridade: 80
  se:
    - {fato: formulacao.solicitada, op: "=", valor: true}
    - {fato: perfil.fase, op: "=", valor: pre_parto}
    - {fato: lote.fracao_primiparas, op: "<", valor: 1}
  entao:
    - concluir: {fato: pl.dcad_max, valor: "@params.dcad_alerta_preparto"}
  fonte: "Santos et al. 2019"
  forca: A

- id: FOR-10
  versao: 1
  modulo: formulacao
  descricao: PL inviável por energia — faltam alimentos energéticos
  prioridade: 60
  se:
    - {fato: pl.status, op: in, valor: [inviavel, parcial]}
    - {fato: pl.restricoes_violadas, op: contem, valor: energia}
  entao:
    - alerta:
        nivel: critico
        categoria: formulacao
        titulo: "Energia não atingível com os alimentos escolhidos"
        causa: "Mesmo no máximo de consumo, os alimentos não fornecem {pl.ell_min:.1f} Mcal de ELl/dia."
        acao: "Incluir fonte energética (milho moído, polpa cítrica), usar volumoso de melhor qualidade ou reduzir a meta de leite."
        titulo_produtor: "Com esses alimentos não dá para chegar na energia que o lote precisa"
        causa_produtor: "Mesmo comendo o máximo, esses alimentos não sustentam a produção."
        acao_produtor: "Inclua milho ou polpa cítrica, use um volumoso melhor ou aceite produzir menos."
  fonte: "Dossiê (diagnóstico de inviabilidade)"
  forca: D

- id: FOR-11
  versao: 1
  modulo: formulacao
  descricao: PL inviável por proteína
  prioridade: 60
  se:
    - {fato: pl.status, op: in, valor: [inviavel, parcial]}
    - {fato: pl.restricoes_violadas, op: contem, valor: proteina}
  entao:
    - alerta:
        nivel: critico
        categoria: formulacao
        titulo: "Proteína fora da faixa com os alimentos escolhidos"
        causa: "Não é possível chegar a {pl.pb_min:.1f}–{pl.pb_max:.1f}% de PB."
        acao: "Incluir fonte proteica (farelo de soja, caroço de algodão) ou ureia (até {@params.ureia_max}% da MS)."
        titulo_produtor: "Com esses alimentos a proteína não fica certa"
        causa_produtor: "Não dá para acertar a proteína só com o que foi marcado."
        acao_produtor: "Inclua farelo de soja, caroço de algodão ou ureia (no máximo {@params.ureia_max}% da comida seca)."
  fonte: "Dossiê (diagnóstico de inviabilidade)"
  forca: D

- id: FOR-12
  versao: 1
  modulo: formulacao
  descricao: PL inviável por fibra mínima
  prioridade: 60
  se:
    - {fato: pl.status, op: "=", valor: inviavel}
    - {fato: pl.restricoes_violadas, op: contem, valor: fibra}
  entao:
    - alerta:
        nivel: critico
        categoria: formulacao
        titulo: "Fibra mínima não atingível"
        causa: "Falta volumoso para cumprir FDN ≥ {meta.fdn_min:.0f}% e FDNf ≥ {meta.fdnf_min:.0f}% da MS."
        acao: "Incluir ou liberar mais volumoso na formulação."
        titulo_produtor: "Falta volumoso para a dieta ficar segura"
        causa_produtor: "Sem fibra suficiente, o rúmen azeda (acidose)."
        acao_produtor: "Marque mais volumoso na sugestão."
  fonte: "NRC 2001"
  forca: D

- id: FOR-13
  versao: 1
  modulo: formulacao
  descricao: PL inviável por enchimento (FDN demais para o consumo)
  prioridade: 60
  se:
    - {fato: pl.status, op: "=", valor: inviavel}
    - {fato: pl.restricoes_violadas, op: contem, valor: enchimento}
  entao:
    - alerta:
        nivel: critico
        categoria: formulacao
        titulo: "Volumoso muito fibroso limita o consumo"
        causa: "A FDN necessária ultrapassa o teto de {pl.fdn_max_kg:.1f} kg/dia ({@params.teto_fdn_pct_pv}% do PV)."
        acao: "Usar volumoso mais digestível (silagem de milho) ou mais concentrado."
        titulo_produtor: "O volumoso é fibroso demais: a vaca enche a barriga antes de comer o necessário"
        causa_produtor: "Fibra demais limita quanto a vaca consegue comer."
        acao_produtor: "Use um volumoso melhor (silagem de milho) ou mais concentrado."
  fonte: "Mertens via Epagri"
  forca: B

- id: FOR-14
  versao: 1
  modulo: formulacao
  descricao: PL inviável por CNF ou gordura máximos
  prioridade: 60
  se:
    - {fato: pl.status, op: "=", valor: inviavel}
    - qualquer:
        - {fato: pl.restricoes_violadas, op: contem, valor: cnf}
        - {fato: pl.restricoes_violadas, op: contem, valor: gordura}
  entao:
    - alerta:
        nivel: critico
        categoria: formulacao
        titulo: "Limites de CNF ou gordura impedem a solução"
        causa: "Para atingir a energia seria preciso passar do CNF máximo ou de {@params.ee_max}% de gordura."
        acao: "Incluir volumoso de melhor qualidade ou fontes de energia fibrosas (polpa cítrica, farelo de trigo)."
        titulo_produtor: "Não dá para chegar na energia sem passar do limite de grão ou gordura"
        causa_produtor: "Para chegar na energia, a dieta teria grão ou gordura demais."
        acao_produtor: "Use um volumoso melhor ou energia com fibra (polpa cítrica, farelo de trigo)."
  fonte: "NRC 2001"
  forca: D

- id: FOR-15
  versao: 1
  modulo: formulacao
  descricao: PL inviável porque falta volumoso além da cana
  prioridade: 60
  se:
    - {fato: pl.status, op: "=", valor: inviavel}
    - {fato: pl.restricoes_violadas, op: contem, valor: cana}
  entao:
    - alerta:
        nivel: critico
        categoria: formulacao
        titulo: "Falta volumoso além da cana para esta produção"
        causa: "Com {lote.leite:.0f} kg/vaca a cana pode ser no máximo {pl.cana_max_pct_volumoso:.0f}% do volumoso."
        acao: "Marcar outro volumoso disponível (silagem de milho ou sorgo, capim-elefante)."
        titulo_produtor: "Precisa de outro volumoso além da cana"
        causa_produtor: "Para {lote.leite:.0f} L por vaca, a cana pode ser no máximo {pl.cana_max_pct_volumoso:.0f}% do volumoso."
        acao_produtor: "Marque silagem de milho, silagem de sorgo ou capim-elefante."
  fonte: "Semadesc-MS"
  forca: C

- id: FOR-16
  versao: 1
  modulo: formulacao
  descricao: Informar alimentos escolhidos que não podem entrar na dieta deste lote
  prioridade: 55
  se:
    - {fato: pl.alimentos_excluidos, op: "!=", valor: []}
  entao:
    - alerta:
        nivel: informativo
        categoria: formulacao
        titulo: "Não entraram na formulação: {pl.alimentos_excluidos}"
        causa: "Forragem de pastejo não é oferecida a lote confinado (FOR-06)."
        acao: "Escolha volumosos fornecidos no cocho."
        titulo_produtor: "Ficaram de fora: {pl.alimentos_excluidos}"
        causa_produtor: "Lote confinado não vai ao pasto."
        acao_produtor: "Escolha volumosos dados no cocho."
  fonte: "Definição do sistema de produção"
  forca: A

- id: FOR-17
  versao: 1
  modulo: formulacao
  descricao: PL inviável porque todos os alimentos têm energia demais para a exigência (vaca seca, final de lactação)
  prioridade: 60
  se:
    - {fato: pl.status, op: in, valor: [inviavel, parcial]}
    - {fato: pl.restricoes_violadas, op: contem, valor: excesso_energia}
  entao:
    - alerta:
        nivel: critico
        categoria: formulacao
        titulo: "Alimentos energéticos demais para este lote"
        causa: "Mesmo no consumo mínimo, a energia passa de {pl.ell_max:.1f} Mcal/dia: o lote engordaria."
        acao: "Incluir volumoso menos energético (capim, silagem de sorgo, braquiária) ou reduzir o concentrado."
        titulo_produtor: "Comida forte demais para este lote: as vacas engordariam"
        causa_produtor: "Mesmo comendo o mínimo, sobraria energia."
        acao_produtor: "Use volumoso mais fraco (capim, silagem de sorgo, braquiária) ou menos concentrado."
  fonte: "Penn State; OMAFRA"
  forca: C

- id: FOR-18
  versao: 1
  modulo: formulacao
  descricao: PL inviável porque a DCAD negativa não é atingível com os alimentos escolhidos
  prioridade: 60
  se:
    - {fato: pl.status, op: in, valor: [inviavel, parcial]}
    - {fato: pl.restricoes_violadas, op: contem, valor: dcad}
  entao:
    - alerta:
        nivel: critico
        categoria: formulacao
        titulo: "DCAD do pré-parto não fica negativa com estes alimentos"
        causa: "Os volumosos e concentrados escolhidos têm potássio demais em relação ao cloro e ao enxofre."
        acao: "Cadastrar e incluir um sal aniônico (com os teores de Cl e S do rótulo) ou um volumoso com menos potássio."
        titulo_produtor: "Com esses alimentos a dieta do pré-parto não fica aniônica"
        causa_produtor: "Os alimentos têm potássio demais."
        acao_produtor: "Cadastre e inclua um sal aniônico, ou use um volumoso com menos potássio."
  fonte: "Santos et al. 2019"
  forca: A

- id: FOR-21
  versao: 1
  modulo: formulacao
  descricao: Só energia/proteína são inatingíveis — entregar a melhor dieta possível com o déficit explícito
  prioridade: 55
  se:
    - {fato: pl.status, op: "=", valor: parcial}
  entao:
    - alerta:
        nivel: atencao
        categoria: formulacao
        titulo: "Melhor dieta possível com estes alimentos: R$ {pl.custo:.2f}/vaca/dia"
        causa: "Ela respeita fibra, consumo e limites de inclusão, mas não cobre toda a exigência (veja a verificação)."
        acao: "No pós-parto o balanço energético negativo é esperado: maximize a densidade e acompanhe o ECC; fora dele, inclua alimentos mais energéticos/proteicos."
        titulo_produtor: "Melhor dieta possível com esses alimentos: R$ {pl.custo:.2f} por vaca/dia"
        causa_produtor: "Ela é segura, mas não cobre tudo o que o lote precisa."
        acao_produtor: "Logo após o parto isso é normal (acompanhe o escore); fora disso, inclua alimentos mais fortes."
  fonte: "Programação por metas (folgas penalizadas)"
  forca: D

- id: FOR-20
  versao: 1
  modulo: formulacao
  descricao: PL encontrou a dieta de menor custo
  prioridade: 60
  se:
    - {fato: pl.status, op: "=", valor: otimo}
  entao:
    - alerta:
        nivel: informativo
        categoria: formulacao
        titulo: "Dieta de custo mínimo: R$ {pl.custo:.2f}/vaca/dia"
        causa: "Atende energia, proteína, fibra e limites de inclusão definidos pelas regras."
        acao: "Revise a verificação abaixo e aceite para criar uma nova versão da dieta."
        titulo_produtor: "Dieta mais barata que atende o lote: R$ {pl.custo:.2f} por vaca/dia"
        causa_produtor: "Atende energia, proteína, fibra e os limites de cada alimento."
        acao_produtor: "Confira e aceite para ela virar a dieta do lote."
  fonte: "Programação linear (PuLP + HiGHS): ferramenta, não evidência"
  forca: D
